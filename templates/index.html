<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvora Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">Nuvora Health Console</p>
      <h1>把日常健康紀錄整理成可追蹤的資料流。</h1>
      <p class="intro">你現在可以直接輸入一句話、上傳語音，並在同一頁查看過去的健康資料。</p>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="panel-head">
          <h2>輸入訊息區</h2>
          <span>Text to JSON</span>
        </div>
        <form id="text-form" class="stack">
          <label>
            <span>使用者 ID</span>
            <input id="text-user-id" name="user_id" type="text" value="local-dev">
          </label>
          <label>
            <span>今天想記錄什麼？</span>
            <textarea id="text-input" name="text" rows="5" placeholder="例如：我今天喝了1800ml的水，睡了7小時，平均心率72"></textarea>
          </label>
          <label class="checkbox">
            <input id="text-save" name="save" type="checkbox" checked>
            <span>解析後直接存進資料庫</span>
          </label>
          <button type="submit">送出文字紀錄</button>
        </form>
        <pre id="text-result" class="result">尚未送出文字解析。</pre>
      </article>

      <article class="panel">
        <div class="panel-head">
          <h2>語音輸入區</h2>
          <span>Whisper + GPT</span>
        </div>
        <form id="audio-form" class="stack">
          <label>
            <span>使用者 ID</span>
            <input id="audio-user-id" name="user_id" type="text" value="local-dev">
          </label>
          <label class="file-picker">
            <span>上傳音檔</span>
            <input id="audio-file" name="audio" type="file" accept="audio/*">
          </label>
          <label class="checkbox">
            <input id="audio-save" name="save" type="checkbox" checked>
            <span>語音解析後直接存進資料庫</span>
          </label>
          <button type="submit">送出語音檔</button>
        </form>
        <pre id="audio-result" class="result">尚未送出語音解析。</pre>
      </article>
    </section>

    <section class="panel history-panel">
      <div class="panel-head">
        <h2>過去資料顯示</h2>
        <span>History Feed</span>
      </div>
      <form id="filter-form" class="history-controls">
        <input id="history-user-id" type="text" placeholder="輸入 user_id 篩選，例如 local-dev">
        <button type="submit">重新整理</button>
      </form>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
